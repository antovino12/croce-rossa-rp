<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello Gestionale</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --danger: #cf6679;
            --border: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--primary);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        button {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        button:hover {
            opacity: 0.9;
        }
        button.danger {
            background-color: var(--danger);
            color: #fff;
        }
        button.secondary {
            background-color: var(--secondary);
        }
        input, select, textarea {
            background-color: #2c2c2c;
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #252525;
        }
        .admin-section {
            border: 2px dashed var(--primary);
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pannello Gestionale</h1>

    <!-- Sezione Operatore -->
    <div class="card">
        <h2>Area Operatore</h2>
        <div style="margin-bottom: 15px;">
            <label for="currentOperator">Seleziona Operatore:</label>
            <select id="currentOperator">
                <option value="">-- Seleziona --</option>
            </select>
        </div>
        <button onclick="toggleService()" id="serviceBtn" class="secondary">Apri Servizio</button>
        <p>Stato Servizio: <strong id="serviceStatus">Chiuso</strong></p>
        <p>Ore totali registrate: <strong id="operatorHours">0.00</strong> ore</p>
    </div>

    <!-- Sezione Certificati Anamnestici -->
    <div class="card">
        <h2>Emissione Certificati Anamnestici</h2>
        <label>Nome Paziente:</label>
        <input type="text" id="patientName" placeholder="Nome e Cognome">
        
        <label>Esito / Dettagli:</label>
        <textarea id="anamnesticDetails" rows="4"></textarea>
        
        <button onclick="sendAnamnesticCertificate()">Emetti e Invia su Discord</button>
    </div>

    <!-- Pannello Admin -->
    <div class="card admin-section">
        <h2>Pannello Amministratore</h2>
        
        <h3>Configurazione Discord</h3>
        <label>Webhook Discord Prenotazioni / Generale:</label>
        <input type="text" id="discordWebhook" placeholder="https://discord.com/api/webhooks/...">
        
        <label>Webhook Discord Certificati Anamnestici (Canale Dedicato):</label>
        <input type="text" id="discordAnamnesticWebhook" placeholder="https://discord.com/api/webhooks/...">

        <h3>Gestione Bozza Certificati Anamnestici</h3>
        <label>Modifica Testo Predefinito Bozza:</label>
        <textarea id="adminTemplate" rows="4">Certificato Anamnestico rilasciato in data odierna. Esito accertamenti: [INSERIRE ESITO]. Operatore: [OPERATORE]</textarea>
        <button onclick="saveTemplate()">Salva Bozza</button>

        <h3>Gestione Operatori</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="text" id="newOperatorName" placeholder="Nome nuovo operatore" style="margin-bottom: 0;">
            <button onclick="addOperator()">Aggiungi</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Nome Operatore</th>
                    <th>Ore Totali</th>
                    <th>Azioni Manuali (Ore)</th>
                </tr>
            </thead>
            <tbody id="operatorsTableBody">
                <!-- Popolato da JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Inizializzazione Dati
    let operators = JSON.parse(localStorage.getItem('operators')) || [];
    let currentOp = localStorage.getItem('currentOp') || '';
    let webhook = localStorage.getItem('discordWebhook') || '';
    let anamnesticWebhook = localStorage.getItem('discordAnamnesticWebhook') || '';
    let anamnesticTemplate = localStorage.getItem('anamnesticTemplate') || document.getElementById('adminTemplate').value;

    document.getElementById('discordWebhook').value = webhook;
    document.getElementById('discordAnamnesticWebhook').value = anamnesticWebhook;
    document.getElementById('adminTemplate').value = anamnesticTemplate;

    // Salvataggio impostazioni webhook in tempo reale
    document.getElementById('discordWebhook').addEventListener('input', (e) => {
        localStorage.setItem('discordWebhook', e.target.value);
    });
    document.getElementById('discordAnamnesticWebhook').addEventListener('input', (e) => {
        localStorage.setItem('discordAnamnesticWebhook', e.target.value);
    });

    function saveTemplate() {
        anamnesticTemplate = document.getElementById('adminTemplate').value;
        localStorage.setItem('anamnesticTemplate', anamnesticTemplate);
        alert('Bozza aggiornata con successo!');
    }

    function updateUI() {
        const select = document.getElementById('currentOperator');
        select.innerHTML = '<option value="">-- Seleziona --</option>';
        
        const tbody = document.getElementById('operatorsTableBody');
        tbody.innerHTML = '';

        operators.forEach((op, index) => {
            // Option per select operatore
            const opt = document.createElement('option');
            opt.value = op.name;
            opt.textContent = op.name;
            if (op.name === currentOp) opt.selected = true;
            select.appendChild(opt);

            // Tabella admin
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${op.name}</td>
                <td>${(op.hours || 0).toFixed(2)}</td>
                <td>
                    <button onclick="adjustHours(${index}, 1)">+1h</button>
                    <button onclick="adjustHours(${index}, -1)" class="danger">-1h</button>
                    <button onclick="adjustHours(${index}, 0.5)">+30m</button>
                    <button onclick="adjustHours(${index}, -0.5)" class="danger">-30m</button>
                    <button onclick="deleteOperator(${index})" class="danger">Elimina</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        localStorage.setItem('operators', JSON.stringify(operators));
        
        if (currentOp) {
            const opObj = operators.find(o => o.name === currentOp);
            if (opObj) {
                document.getElementById('operatorHours').textContent = (opObj.hours || 0).toFixed(2);
                const btn = document.getElementById('serviceBtn');
                const status = document.getElementById('serviceStatus');
                if (opObj.inService) {
                    btn.textContent = "Chiudi Servizio";
                    btn.className = "danger";
                    status.textContent = "Aperto (In Servizio)";
                } else {
                    btn.textContent = "Apri Servizio";
                    btn.className = "secondary";
                    status.textContent = "Chiuso";
                }
            }
        }
    }

    document.getElementById('currentOperator').addEventListener('change', (e) => {
        currentOp = e.target.value;
        localStorage.setItem('currentOp', currentOp);
        updateUI();
    });

    function addOperator() {
        const nameInput = document.getElementById('newOperatorName');
        const name = nameInput.value.trim();
        if(!name) return alert('Inserisci un nome valido');
        
        operators.push({ name: name, hours: 0, inService: false, startTime: null });
        nameInput.value = '';
        updateUI();
    }

    function deleteOperator(index) {
        if(confirm('Sei sicuro di voler eliminare questo operatore?')) {
            if(operators[index].name === currentOp) {
                currentOp = '';
                localStorage.setItem('currentOp', '');
            }
            operators.splice(index, 1);
            updateUI();
        }
    }

    function adjustHours(index, amount) {
        operators[index].hours = Math.max(0, (operators[index].hours || 0) + amount);
        updateUI();
    }

    function toggleService() {
        if(!currentOp) return alert('Seleziona prima un operatore!');
        
        const op = operators.find(o => o.name === currentOp);
        const now = new Date().getTime();

        if(!op.inService) {
            // Apertura servizio
            op.inService = true;
            op.startTime = now;
        } else {
            // Chiusura servizio (TEMPO REALE NORMALE, NESSUN RADDOPPIO)
            const diffHours = (now - op.startTime) / (1000 * 60 * 60);
            op.hours = (op.hours || 0) + diffHours;
            op.inService = false;
            op.startTime = null;
        }
        updateUI();
    }

    function sendAnamnesticCertificate() {
        const targetWebhook = document.getElementById('discordAnamnesticWebhook').value || document.getElementById('discordWebhook').value;
        if(!targetWebhook) return alert('Inserisci prima un webhook Discord valido per i certificati!');
        
        const patient = document.getElementById('patientName').value;
        const details = document.getElementById('anamnesticDetails').value;
        
        if(!patient) return alert('Inserisci il nome del paziente!');

        // Applica bozza
        let messageText = anamnesticTemplate
            .replace('[INSERIRE ESITO]', details || 'Nessun dettaglio aggiuntivo')
            .replace('[OPERATORE]', currentOp || 'Sistema');

        const payload = {
            content: `📋 **NUOVO CERTIFICATO ANAMNESTICO EMESSO**\n**Paziente:** ${patient}\n\n\`\`\`text\n${messageText}\n\`\`\``
        };

        fetch(targetWebhook, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(res => {
            if(res.ok || res.status === 204) {
                alert('Certificato inviato con successo sul canale Discord dedicato!');
                document.getElementById('patientName').value = '';
                document.getElementById('anamnesticDetails').value = '';
            } else {
                alert('Errore durante l\'invio su Discord.');
            }
        }).catch(err => {
            console.error(err);
            alert('Errore di connessione al webhook.');
        });
    }

    // Caricamento iniziale
    updateUI();
</script>

</body>
</html>
